# PokeCall - bloco do Nginx para o servidor de sinalizacao (WebSocket)
# Ja preenchido para call.centraluniko.com.br.
#
# Comeca so com HTTP (porta 80). O certbot cria o bloco HTTPS (443) sozinho
# e adiciona o redirecionamento. Isso evita erro de "certificado nao encontrado".
#
# Salvar como /etc/nginx/sites-available/pokecall (veja SETUP-VPS.md).

server {
    listen 80;
    server_name call.centraluniko.com.br;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabecalhos que fazem o "upgrade" para WebSocket funcionar:
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A conexao de sinalizacao fica aberta durante toda a call:
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
