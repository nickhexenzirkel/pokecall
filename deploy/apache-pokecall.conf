# PokeCall - VirtualHost do Apache para o servidor de sinalizacao (WebSocket seguro)
#
# Alternativa ao nginx. Cria um SUBDOMINIO (ex: call.seudominio.com) que
# encaminha o WebSocket para o Node local na porta 8080. Nao mexe no site atual.
#
# Antes, habilite os modulos necessarios:
#   sudo a2enmod proxy proxy_http proxy_wstunnel ssl rewrite
#
# 1. Troque "call.SEUDOMINIO.com" pelo seu subdominio.
# 2. Salve como /etc/apache2/sites-available/pokecall.conf
# 3. Habilite:  sudo a2ensite pokecall  &&  sudo systemctl reload apache2
# 4. O certbot cria o SSL (veja SETUP-VPS.md).

<VirtualHost *:80>
    ServerName call.SEUDOMINIO.com
    # O certbot adiciona o redirecionamento para HTTPS.
</VirtualHost>

<VirtualHost *:443>
    ServerName call.SEUDOMINIO.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/call.SEUDOMINIO.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/call.SEUDOMINIO.com/privkey.pem

    # Encaminha o handshake WebSocket e o HTTP normal para o Node:
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8080/$1" [P,L]

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyPreserveHost On
</VirtualHost>
