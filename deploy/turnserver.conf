# PokeCall - configuracao do coturn (servidor TURN/STUN proprio)
# Ja preenchido para call.centraluniko.com.br / IP 187.127.27.98.
# Copie para /etc/turnserver.conf (faca backup do original antes).
# IMPORTANTE: o coturn nao aceita comentario na mesma linha de um valor.

# Portas padrao de TURN/STUN
listening-port=3478
tls-listening-port=5349

# Escuta em todas as interfaces
listening-ip=0.0.0.0

# IP PUBLICO do VPS
external-ip=187.127.27.98

# Nome/realm
realm=call.centraluniko.com.br
server-name=call.centraluniko.com.br

# Autenticacao por usuario/senha
lt-cred-mech
user=pokecall:OGZnakfLDW6Vi5vLqlDANTM7

# Reaproveita o certificado SSL do subdominio (criado pelo certbot).
# So descomente estas 2 linhas DEPOIS que o certbot tiver rodado:
#cert=/etc/letsencrypt/live/call.centraluniko.com.br/fullchain.pem
#pkey=/etc/letsencrypt/live/call.centraluniko.com.br/privkey.pem

# Faixa de portas usada para retransmitir a midia
min-port=49152
max-port=65535

# Boas praticas de seguranca/estabilidade
fingerprint
no-cli
no-multicast-peers
stale-nonce=600

# Log
log-file=/var/log/turnserver.log
simple-log
