<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PokeCall</title>
<style>
  :root {
    --accent: #ffd23f;
    --green: #3ba55d;
    --danger: #ed4245;
    --text: #f2f3f5;
    --text-dim: #b5bac1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  body { display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }

  .card {
    display: flex; flex-direction: column; gap: 7px;
    padding: 8px;
    background: rgba(24,25,28,0.88);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }

  /* Faixa de arrastar */
  .head {
    display: flex; align-items: center; gap: 6px;
    -webkit-app-region: drag;
    padding: 1px 2px 0;
  }
  .head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
  .head .dot.on { background: var(--green); }
  .head .live { font-size: 11px; color: var(--text-dim); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head button { -webkit-app-region: no-drag; }
  .head-btn {
    width: 20px; height: 20px; flex-shrink: 0;
    display: grid; place-items: center;
    background: transparent; border: none; border-radius: 6px;
    color: var(--text-dim); cursor: pointer;
  }
  .head-btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }
  .head-btn svg { width: 13px; height: 13px; }

  /* Mensagens recentes */
  .msgs { display: flex; flex-direction: column; gap: 6px; }
  .msgs:empty { display: none; }
  .msg {
    display: flex; gap: 7px; align-items: flex-start;
    padding: 5px 7px;
    background: rgba(255,255,255,0.06);
    border-left: 2px solid var(--accent);
    border-radius: 8px;
    animation: in 0.2s ease;
    transition: opacity 0.5s ease;
    user-select: text;
  }
  .msg.leaving { opacity: 0; }
  .msg .av {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #3a3c42, #26272b);
    color: var(--accent); font-size: 10px; font-weight: 700;
  }
  .msg .av img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .msg .who { font-size: 11px; font-weight: 700; color: var(--accent); }
  .msg .txt { font-size: 13px; line-height: 1.3; word-break: break-word; }
  .msg .txt img { height: 20px; vertical-align: middle; }
  @keyframes in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Linha de ação: microfone + escrever */
  .row { display: flex; align-items: center; gap: 6px; }
  .mic {
    width: 34px; height: 34px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--danger); color: #fff;
    border: none; border-radius: 50%; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .mic.on { background: var(--green); }
  .mic:active { transform: scale(0.94); }
  .mic svg { width: 17px; height: 17px; }
  form { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  input {
    flex: 1; min-width: 0;
    padding: 7px 11px; border-radius: 16px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff; outline: none; font-size: 13px;
    font-family: inherit; user-select: text; cursor: text;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  input:focus { border-color: var(--accent); }
  .send {
    width: 30px; height: 30px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--accent); color: #2a2100;
    border: none; border-radius: 50%; cursor: pointer;
  }
  .send svg { width: 15px; height: 15px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <span class="dot" id="dot"></span>
      <span class="live" id="live">PokeCall</span>
      <button class="head-btn" id="btn-open" title="Abrir o PokeCall"></button>
      <button class="head-btn" id="btn-close" title="Fechar a janelinha"></button>
    </div>

    <div class="msgs" id="msgs"></div>

    <div class="row">
      <button class="mic" id="mic" title="Ligar/desligar microfone"></button>
      <form id="form">
        <input id="input" type="text" placeholder="Comentar no chat…" maxlength="2000" autocomplete="off" />
        <button class="send" type="submit" title="Enviar"></button>
      </form>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
